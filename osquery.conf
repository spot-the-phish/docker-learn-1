{
  "options": {
    "logger_path": "C:\\Program Files\\osquery\\log",
    "disable_logging": "false",
    "logger_rotate": "true",
    "logger_rotate_size": "26214400",
    "disable_events": "false",
    "schedule_splay_percent": "10"
  },
  "schedule": {
    "services_info": {
      "query": "SELECT name, display_name, status, start_type, path, user_account FROM services;",
      "interval": 1800
    },
    "windows_logon_success": {
      "query": "SELECT datetime, eventid, channel, provider_name, data FROM windows_eventlog WHERE eventid = 4624 AND channel = 'Security' AND time > (strftime('%s','now') - 900);",
      "interval": 900
    },
    "windows_logon_failure": {
      "query": "SELECT datetime, eventid, channel, provider_name, data FROM windows_eventlog WHERE eventid = 4625 AND channel = 'Security' AND time > (strftime('%s','now') - 900);",
      "interval": 900
    },
    "powershell_scripts": {
      "query": "SELECT time, event_type, script_block_text, command_line, user FROM powershell_events WHERE time > (strftime('%s','now') - 900);",
      "interval": 900
    },
    "process_info": {
      "query": "SELECT pid, name, path, cmdline, parent, uid, start_time FROM processes WHERE pid = 1;",
      "interval": 600
    },
    "drivers_info": {
      "query": "SELECT device_id, service, image, description, manufacturer, driver_version FROM drivers;",
      "interval": 3600
    },
    "scheduled_tasks_info": {
      "query": "SELECT name, path, action, enabled, hidden, state FROM scheduled_tasks WHERE hidden = 1 AND enabled = 1;",
      "interval": 1800
    },
    "pipes_info": {
      "query": "SELECT name, instances, max_instances, flags FROM pipes;",
      "interval": 3600
    },
    "prefetch_info": {
      "query": "SELECT filename, path, last_run_time, run_count FROM prefetch;",
      "interval": 21600
    },
    "logon_sessions_info": {
      "query": "SELECT logon_id, user, logon_domain, authentication_package, logon_type, logon_time FROM logon_sessions;",
      "interval": 900
    },
    "autoexec_info": {
      "query": "SELECT path, name, source, status FROM autoexec;",
      "interval": 3600
    },
    "authenticode_info": {
      "query": "SELECT p.pid, p.name, p.path, s.result, s.subject_name, s.issuer_name FROM processes p LEFT JOIN authenticode s ON p.path = s.path WHERE p.path LIKE 'C:\\Windows\\System32\\%.exe';",
      "interval": 3600
    },
    "browser_extensions_chromium": {
      "query": "SELECT browser_type, name, identifier, version, description, author, enabled, install_time, update_url, path FROM chrome_extensions;",
      "interval": 21600
    },
    "browser_extensions_firefox": {
      "query": "SELECT name, identifier, version, creator, description, active, install_date, update_date, source_uri, path FROM firefox_addons;",
      "interval": 21600
    }
  },
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system_info;",
      "SELECT user AS username FROM logged_in_users ORDER BY time DESC LIMIT 1;"
    ]
  }
}